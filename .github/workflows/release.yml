name: release

# v1.2.3 형식의 태그를 올리면: 그 버전으로 빌드 → SHA-256 → 깃헙 릴리스 생성
# 런처의 자동 업데이트는 최신 릴리스의 joylauncher.nro (+ .sha256) 를 받아 검증 후 설치한다.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      LC_ALL: C.UTF-8   # zip 이 한글 파일 이름(설명서.md)을 UTF-8 로 저장하도록
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Check portlibs (devkitpro/devkita64 이미지에 포함, devkitPro 서버는 CI 다운로드를 막음)
        run: |
          for l in libSDL2 libSDL2_image libSDL2_ttf libSDL2_mixer libmpg123 libvorbisidec libavformat libcurl libdav1d; do test -f /opt/devkitpro/portlibs/switch/lib/$l.a || { echo "missing $l"; exit 1; }; done
          (type -p zip >/dev/null) || (apt-get update -qq && apt-get install -y -qq zip)
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          make -j"$(nproc)" APP_VERSION="$VER"
          sha256sum joylauncher.nro | cut -d' ' -f1 > joylauncher.nro.sha256
          mkdir -p pkg/switch/joylauncher
          cp joylauncher.nro pkg/switch/joylauncher/
          mkdir -p pkg/JoyLauncher/themes
          cp -r themes/JoyBasic pkg/JoyLauncher/themes/
          cp docs/설명서.md OFL.txt LICENSE pkg/
          cp docs/manual-en.md pkg/Manual_en.md
          (cd themes && zip -qr -X ../JoyBasic.zip JoyBasic)   # 런처의 테마 선택 창에서 받는 기본 테마
          (cd pkg && zip -qr -UN=UTF8 "../JoyLauncher_${VER}.zip" .)
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          if [ -f "docs/releases/v${VER}.md" ]; then cp "docs/releases/v${VER}.md" notes.md; else echo "Joy Launcher v${VER}" > notes.md; fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Joy Launcher v${{ env.VER }}
          body_path: notes.md
          files: |
            joylauncher.nro
            joylauncher.nro.sha256
            JoyLauncher_${{ env.VER }}.zip
            JoyBasic.zip
