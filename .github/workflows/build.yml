name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portlibs
        run: |
          dkp-pacman -Syu --noconfirm --needed switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-ffmpeg switch-curl switch-dav1d switch-freetype switch-harfbuzz switch-libpng switch-libjpeg-turbo switch-libwebp switch-bzip2 switch-zlib
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: joylauncher-nro
          path: joylauncher.nro
