name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check portlibs (devkitpro/devkita64 이미지에 포함, devkitPro 서버는 CI 다운로드를 막음)
        run: |
          for l in libSDL2 libSDL2_image libSDL2_ttf libavformat libcurl libdav1d; do test -f /opt/devkitpro/portlibs/switch/lib/$l.a || { echo "missing $l"; exit 1; }; done
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: joylauncher-nro
          path: joylauncher.nro
